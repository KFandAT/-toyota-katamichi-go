```yaml
name: Toyota Katamichi GO Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

# GitHubへの書き込み権限
permissions:
  contents: write

# 同時実行によるstate.jsonの競合を防止
concurrency:
  group: toyota-katamichi-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Toyota Katamichi GO
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

          FILTER_START: ${{ vars.FILTER_START }}
          FILTER_RETURN: ${{ vars.FILTER_RETURN }}
          FILTER_CAR: ${{ vars.FILTER_CAR }}

        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi

          git commit -m "Update vehicle monitoring state"

          git push origin HEAD:${GITHUB_REF_NAME}
```
