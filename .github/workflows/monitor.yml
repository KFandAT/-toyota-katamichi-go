name: Toyota Katamichi GO Monitor

on:
  schedule:
    - cron: "2-57/5 * * * *"
      timezone: "Asia/Tokyo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toyota-katamichi-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # リポジトリの取得
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # Python環境の構築
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 実行情報の表示
      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

      # 片道GO!の監視
      - name: Check Toyota Katamichi GO
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

          FILTER_START: ${{ vars.FILTER_START }}
          FILTER_RETURN: ${{ vars.FILTER_RETURN }}
          FILTER_CAR: ${{ vars.FILTER_CAR }}

        run: python monitor.py

      # state.jsonの保存
      - name: Save state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi

          git commit -m "Update monitoring state"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
