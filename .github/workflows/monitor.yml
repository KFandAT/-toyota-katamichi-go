name: Toyota Katamichi GO Monitor

on:
  schedule:
    - cron: "2-57/5 * * * *"
      timezone: "Asia/Tokyo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toyota-katamichi-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Toyota Katamichi GO
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

          FILTER_START: ${{ vars.FILTER_START }}
          FILTER_RETURN: ${{ vars.FILTER_RETURN }}
          FILTER_CAR: ${{ vars.FILTER_CAR }}

        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi

          git commit -m "update state"

          # GitHub側の最新変更を取得
          git fetch origin main

          # 最新のmainに今回の変更を反映
          git rebase origin/main

          # GitHubへ保存
          git push origin HEAD:main
